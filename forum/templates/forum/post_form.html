{% extends 'base.html' %}

{% block title %}Редагувати пост — Форум{% endblock %}

{% block content %}
<div class="hero">
    <h1 class="hero__title">Редагувати пост</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% for field in form %}
            <div style="margin-bottom: 1.5rem;">
                <label for="{{ field.id_for_label }}" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: #ff5252; margin-top: 0.25rem; font-size: 0.85rem;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div style="display: flex; gap: 1rem; align-items: center;">
            <button type="submit" class="btn">Зберегти зміни</button>
            <a href="{% url 'forum:thread_detail' post.thread.pk %}" class="btn btn--outline">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
