<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body>
    <a href="{% url 'forum:thread_list' %}">← Повернутися до списку гілок</a>
    <h1>{{ title }}</h1>
    {% if delete_confirmation %}
        <p>Ви дійсно хочете видалити гілку «{{ thread.title }}»?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Підтвердити видалення</button>
        </form>
    {% else %}
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div>
                {{ form.title.label_tag }}<br>
                {{ form.title }}
                {{ form.title.errors }}
            </div>
            <button type="submit">Зберегти</button>
        </form>
    {% endif %}
</body>
</html>
