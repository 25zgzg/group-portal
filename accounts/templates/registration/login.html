 <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Увійти</title>
</head>
<body>
    <h1>Увійти</h1>
    {% if form.errors %}
        <p>Невірні дані. Спробуйте ще раз.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div>
            {{ form.username.label_tag }}<br>
            {{ form.username }}
            {{ form.username.errors }}
        </div>
        <div>
            {{ form.password.label_tag }}<br>
            {{ form.password }}
            {{ form.password.errors }}
        </div>
        <button type="submit">Увійти</button>
        <input type="hidden" name="next" value="{{ next }}" />
    </form>
</body>
</html>
